<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced Track Pattern Editor</title>
  <style>
    /* Global Styles */
    html, body {
      margin: 5px;
      padding: 5px;
      height: 100vh;
      box-sizing: border-box;
      background-color: black;
      color: #33ff33;
      font-family: monospace;
      font-size: 10px;
      zoom: 1.7;
    }
    .container { width: 100%; }
    /* Control Panel Styles */
    .controls {
      background-color: black;
      color: #33ff33;
      padding: 0;
      margin: 0;
    }
    .controls span,
    .controls input,
    .controls button {
      background-color: black;
      color: #33ff33;
      border: 1px solid #33ff33;
      padding: 5px;
      margin: 5px;
      cursor: pointer;
      font-size: 6px;
      font-weight: bold;
    }
    .songButtons {
      background-color: black;
      color: #33ff33;
      border: 1px solid #33ff33;
      padding: 5px;
      margin: 5px;
      display: inline-block;
    }
    .songButtons span {
      font-size: 10px;
      margin-right: 5px;
      font-weight: bold;
    }
    /* Textareas */
    textarea {
      width: 100%;
      padding: 5px;
      border: 1px solid #33ff33;
      background-color: black;
      color: #33ff33;
      resize: both;
      white-space: pre;
      overflow: auto;
      text-shadow: none;
    }
    /* Specific Textareas */
    #patternedit, #instruments, #orchestra { height: 10em; }
    .buttons {
      margin-top: 5px;
      text-align: left;
    }
    .buttons button {
      background-color: black;
      color: #33ff33;
      border: 1px solid #33ff33;
      padding: 5px;
      margin: 5px;
      cursor: pointer;
      font-size: 10px;
      font-weight: bold;
    }
    .buttons button:hover {
      background-color: #00ff00;
      color: black;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Read-only Csound Console -->
    <textarea id="console" readonly rows="4">Csound: not loaded</textarea>
    <!-- Read-only Orchestra Code -->
    <textarea id="orchestra"></textarea>
    <!-- Control Panel -->
    <div class="controls">
      <label for="bpmSlider">BPM:</label>
      <input type="range" id="bpmSlider" min="1" max="480" value="120" oninput="updateBPM()">
      <label for="loopCheckbox">Loop:</label>
      <input type="checkbox" id="loopCheckbox">
      <label for="loopStart">Loop From:</label>
      <input type="number" id="loopStart" min="1" value="1" style="width:30px" onchange="validateLoopRange()">
      <label for="loopEnd">Loop To:</label>
      <input type="number" id="loopEnd" min="1" value="1" style="width:30px" onchange="validateLoopRange()">
      <div>
        Examples: 
        <button onclick="loadExampleSong('1.bin')">1</button>
        <button onclick="loadExampleSong('2.bin')">2</button>
        <button onclick="loadExampleSong('3.bin')">3</button>
        <button onclick="loadExampleSong('4.bin')">4</button>
        <button onclick="addPattern()">+ Pattern</button>
        <button onclick="removePattern()">– Pattern</button>
        <button onclick="copyPattern()">Insert Copy</button>
        <button onclick="copyToBuffer()">Copy</button>
        <button onclick="pasteFromBuffer()">Paste</button>
        <button id="playToggle" onclick="togglePlay()">Play</button>
        <button onclick="savePatternData()">Save Data</button>
        <button onclick="document.getElementById('loadInput').click()">Load Data</button>
        <button onclick="songInit()">Song Init</button>
        <button onclick="Play()">Play note</button>
        <button onclick="compile()">Compile</button>
      </div>
    </div>
    <!-- Pattern Counter now shows beat number (1 beat = 16 steps) -->
    <span id="patternCounter">Pattern: 1/1 | Beat: 1 | BPM: 120</span>
    <!-- Editable Pattern Editor.
         Header row: |***| followed by each track’s header (e.g. "######01######"|...|######08######|)
         Then 512 step rows. Each row begins with the step counter (e.g. "|000|") and then one cell per track formatted as "00,00,00,00,00".
         Special characters (|, commas, asterisks) are non-editable.
         In each cell, when you insert a value (or '^'), the digit overwrites that location and then the caret stays in that cell.
         (You can use arrow keys to reposition if needed.) -->
    <textarea class="code" id="patternedit" placeholder="Pattern Editor"></textarea>
    <!-- Read-only Csound Function Table Output -->
    <textarea id="instruments" readonly placeholder="Csound Array Output"></textarea>
  </div>
  
  <!-- Hidden File Input -->
  <input type="file" id="loadInput" style="display:none" onchange="loadPatternData(event)">
  
  <!-- Include csound.js (ensure correct path) -->
  <script src="csound.js"></script>
  <script>
    /***************************************************
     * Global Variables and Cached Elements
     ***************************************************/
    const stepsPerPattern = 512;  // now 512 steps per pattern
    const channels = ["A", "B", "C", "D", "E"]; // five channels per track
    let tracksData = [];
    let currentPatternIndex = 0;
    let currentStepJS = 0;
    let currentBPM = 120;
    let bpmBuffer = 120;
    let isPlaying = false;
    let patternBuffer = null;
    let loopStart = 0;
    let loopEnd = 0;
    let prevStep = -1;
    
    // Cached DOM elements
    const consoleEl     = document.getElementById("console");
    const orchestraEl   = document.getElementById("orchestra");
    const instrumentsEl = document.getElementById("instruments");
    const patternEditEl = document.getElementById("patternedit");
    
    /***************************************************
     * Helper Functions
     ***************************************************/
    function getTotalPatterns() {
      return tracksData.length > 0 ? tracksData[0].patterns.length : 0;
    }
    function getTotalSteps() {
      return getTotalPatterns() * stepsPerPattern;
    }
    function debounce(func, wait) {
      let timeout;
      return function(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }
    const debouncedUpdateInstruments = debounce(() => {
      csound.compileOrc(instrumentsEl.value);
    }, 200);
    
    /***************************************************
     * Clock Worker Setup
     ***************************************************/
    let clockWorker = null;
    function initClockWorker() {
      // Note: update the worker code so stepsPerPattern is 512.
      const workerCode = `
        let bpm = 120, currentStep = 0, running = false, nextTickTime = 0;
        const stepsPerPattern = 512;
        function scheduleTick() {
          if (!running) return;
          const now = performance.now();
          const interval = (60000 / bpm) / 16;
          if (now > nextTickTime + interval) { nextTickTime = now; }
          postMessage({ type: 'tick', step: currentStep });
          currentStep = (currentStep + 1) % stepsPerPattern;
          nextTickTime += interval;
          const delay = Math.max(0, nextTickTime - performance.now());
          setTimeout(scheduleTick, delay);
        }
        onmessage = function(e) {
          const data = e.data;
          if (data.type === 'start') {
            bpm = data.bpm || 120;
            currentStep = data.step !== undefined ? data.step : 0;
            nextTickTime = performance.now();
            running = true;
            scheduleTick();
          } else if (data.type === 'stop') {
            running = false;
          } else if (data.type === 'updateBpm') {
            bpm = data.bpm;
          } else if (data.type === 'setStep') {
            currentStep = data.step;
            nextTickTime = performance.now();
          }
        };
      `;
      const blob = new Blob([workerCode], { type: 'application/javascript' });
      const workerURL = URL.createObjectURL(blob);
      clockWorker = new Worker(workerURL);
      clockWorker.onmessage = (e) => {
        if (e.data.type === 'tick') updateStep(e.data.step);
      };
    }
    
    /***************************************************
     * Editor and Data Initialization
     ***************************************************/
    function initializeEditor() {
      orchestraEl.value = updateCsoundOrc();
      tracksData = [];
      currentPatternIndex = 0;
      currentStepJS = 0;
      // Initialize 8 tracks.
      for (let i = 1; i <= 8; i++) { tracksData.push(generateTrack(i)); }
      readPattern();
      updateLoopRangeDefaults();
    }
    window.onload = () => { initializeEditor(); initClockWorker(); };
    
    /***************************************************
     * Global Shortcut (CTRL+E to Compile)
     ***************************************************/
    document.addEventListener("keydown", (e) => {
      if (e.ctrlKey && e.key.toLowerCase() === "e") { e.preventDefault(); compile(); }
    });
    
    /***************************************************
     * Csound Integration Functions
     ***************************************************/
    function moduleDidLoad() { csound.Play(); compile(); }
    function compile() {
      csound.compileOrc(instrumentsEl.value);
      csound.compileOrc(orchestraEl.value);
    }
    function updateCsoundOrc() {
      let orcCode = "";
      for (let i = 1; i <= 16; i++) { orcCode += `instr ${i}\n  \nendin\n\n`; }
      orcCode += `instr 17\n gkstepinput chnget "stepvalue"\n  \nendin\n\n`;
      return orcCode;
    }
    // Generate Csound events for a given step.
    // Mapping:
    // - Channel A (first "00") is used as the note–length multiplier (p4); if its value is "00", no event.
    // - Channel B (second "00") is used as the instrument number; if "00", no event.
    // - Channels C, D, E become p5, p6, p7.
    // If channel A is "^^", we default multiplier to 1.
    function generateEventsForStep(stepIndex) {
      tracksData.forEach((track, tIndex) => {
        const pat = track.patterns[currentPatternIndex];
        let A = pat.A[stepIndex];
        let B = pat.B[stepIndex];
        if (A === "00" || B === "00") return;
        let C = pat.C[stepIndex];
        let D = pat.D[stepIndex];
        let E = pat.E[stepIndex];
        let mult = (A === "^^" || isNaN(parseInt(A))) ? 1 : parseInt(A);
        let noteLength = (mult * (60/currentBPM)).toFixed(3);
        let eventStr = "i" + B + " 0 " + noteLength + " " + C + " " + D + " " + E;
        csound.Event(eventStr);
      });
    }
    
    /***************************************************
     * Playback and Clock Functions
     ***************************************************/
    function updateStep(step) {
      if (step === 0 && prevStep === 511) {
        if (document.getElementById("loopCheckbox").checked) {
          currentPatternIndex = (currentPatternIndex < loopEnd) ? currentPatternIndex + 1 : loopStart;
          readPattern();
        } else {
          if (currentPatternIndex >= getTotalPatterns() - 1) { stopCsound(); return; }
          else { currentPatternIndex++; readPattern(); }
        }
      }
      prevStep = step;
      currentStepJS = step;
      csound.SetChannel("stepvalue", currentStepJS);
      generateEventsForStep(currentStepJS);
      // Beat counter: 1 beat per 16 steps.
      const currentBeat = Math.floor(currentStepJS / 16) + 1;
      document.getElementById("patternCounter").textContent =
        `Pattern: ${currentPatternIndex + 1}/${getTotalPatterns()} | Beat: ${currentBeat} | BPM: ${currentBPM}`;
      if (window.csound && typeof window.csound.setControlChannel === "function") {
        window.csound.setControlChannel("stepcount", currentStepJS);
      }
    }
    function togglePlay() {
      compile();
      if (isPlaying) {
        CsoundObj.CSOUND_AUDIO_CONTEXT.resume();
        stopCsound();
        document.getElementById("playToggle").textContent = "Play";
        isPlaying = false;
        if (clockWorker) { clockWorker.postMessage({ type: "stop" }); }
      } else {
        currentBPM = bpmBuffer;
        document.getElementById("bpmSlider").value = currentBPM;
        playCsound();
        document.getElementById("playToggle").textContent = "Stop";
        isPlaying = true;
        if (clockWorker) { clockWorker.postMessage({ type: "start", bpm: currentBPM }); }
      }
    }
    function playCsound() { writePattern(); updateCsoundMatrix(); readPattern(); }
    function stopCsound() {
      if (clockWorker) { clockWorker.postMessage({ type: "stop" }); }
      document.getElementById("playToggle").textContent = "Play";
      isPlaying = false;
    }
    function updateBPM() {
      currentBPM = parseInt(document.getElementById("bpmSlider").value, 10);
      bpmBuffer = currentBPM;
      if (clockWorker && isPlaying) { clockWorker.postMessage({ type: "updateBpm", bpm: currentBPM }); }
      // Update beat display:
      const currentBeat = Math.floor(currentStepJS / 16) + 1;
      document.getElementById("patternCounter").textContent =
        `Pattern: ${currentPatternIndex + 1}/${getTotalPatterns()} | Beat: ${currentBeat} | BPM: ${currentBPM}`;
    }
    
    /***************************************************
     * Data Model Functions
     ***************************************************/
    function initializePattern() {
      return {
        A: new Array(stepsPerPattern).fill("00"),
        B: new Array(stepsPerPattern).fill("00"),
        C: new Array(stepsPerPattern).fill("00"),
        D: new Array(stepsPerPattern).fill("00"),
        E: new Array(stepsPerPattern).fill("00")
      };
    }
    function deepCopyPattern(pattern) {
      return {
        A: [...pattern.A],
        B: [...pattern.B],
        C: [...pattern.C],
        D: [...pattern.D],
        E: [...pattern.E]
      };
    }
    function generateTrack(id) {
      return {
        header: `######${id.toString().padStart(2, '0')}######`,
        patterns: [initializePattern()]
      };
    }
    function updatePatternCounter() {
      const currentBeat = Math.floor(currentStepJS / 16) + 1;
      document.getElementById("patternCounter").textContent =
        `Pattern: ${currentPatternIndex + 1}/${getTotalPatterns()} | Beat: ${currentBeat} | BPM: ${currentBPM}`;
    }
    
    /***************************************************
     * Pattern Editor – Grid Rendering and Editing
     ***************************************************/
    // Renders all 512 steps.
    function readPattern() {
      if (tracksData.length === 0) { patternEditEl.value = ""; updatePatternCounter(); return; }
      let headerLine = "|***|";
      tracksData.forEach(track => { headerLine += track.header + "|"; });
      headerLine += "\n";
      
      let textOutput = headerLine;
      for (let step = 0; step < stepsPerPattern; step++) {
        let line = "|" + step.toString().padStart(3, '0') + "|";
        tracksData.forEach(track => {
          const pat = track.patterns[currentPatternIndex] || initializePattern();
          let cell = [pat.A[step], pat.B[step], pat.C[step], pat.D[step], pat.E[step]].join(",");
          line += cell + "|";
        });
        textOutput += line + "\n";
      }
      patternEditEl.value = textOutput;
      updateCsoundMatrix();
      updatePatternCounter();
    }
    
    // Parses the grid (all 512 rows) back into the model.
    function writePattern() {
      if (tracksData.length === 0) return;
      const lines = patternEditEl.value.split("\n").filter(line => line.trim() !== "");
      if (lines.length < 2) return;
      lines.shift(); // remove header
      lines.forEach((line, step) => {
        const parts = line.split("|").filter(p => p !== "");
        parts.slice(1).forEach((cell, tIndex) => {
          const values = cell.split(",");
          if (values.length === 5) {
            const pat = tracksData[tIndex].patterns[currentPatternIndex];
            pat.A[step] = values[0];
            pat.B[step] = values[1];
            pat.C[step] = values[2];
            pat.D[step] = values[3];
            pat.E[step] = values[4];
          }
        });
      });
      updateCsoundMatrix();
    }
    
    // Keydown handler: Only digits and '^' are allowed in editable positions.
    // Editable positions in each cell ("00,00,00,00,00"): positions 0-1, 3-4, 6-7, 9-10, 12-13.
    // When you finish typing a digit (or '^'), the new value is inserted and the caret remains in that cell.
    patternEditEl.addEventListener("keydown", function(e) {
      if (e.ctrlKey && e.key.toLowerCase() === "e") { e.preventDefault(); compile(); return; }
      if (e.key.length !== 1) return;
      if (!/[0-9^]/.test(e.key)) { e.preventDefault(); return; }
      
      const caret = this.selectionStart;
      const lines = this.value.split("\n");
      let pos = 0, lineIndex = 0;
      for (let i = 0; i < lines.length; i++) {
        if (pos + lines[i].length + 1 > caret) { lineIndex = i; break; }
        pos += lines[i].length + 1;
      }
      if (lineIndex === 0) { e.preventDefault(); return; }
      let col = caret - pos;
      if (col < 5) { e.preventDefault(); return; }
      
      // Each track cell occupies 15 characters.
      let cellIndex = Math.floor((col - 5) / 15);
      let cellStart = 5 + cellIndex * 15;
      let offset = col - cellStart;
      
      let channel = null, digitIndex = null;
      if (offset >= 0 && offset <= 1) { channel = "A"; digitIndex = offset; }
      else if (offset >= 3 && offset <= 4) { channel = "B"; digitIndex = offset - 3; }
      else if (offset >= 6 && offset <= 7) { channel = "C"; digitIndex = offset - 6; }
      else if (offset >= 9 && offset <= 10) { channel = "D"; digitIndex = offset - 9; }
      else if (offset >= 12 && offset <= 13) { channel = "E"; digitIndex = offset - 12; }
      else { e.preventDefault(); return; }
      
      const step = caret === 0 ? 0 : parseInt(lines[lineIndex].slice(1,4));
      if (cellIndex < 0 || cellIndex >= tracksData.length) { e.preventDefault(); return; }
      
      const track = tracksData[cellIndex];
      let currentVal = track.patterns[currentPatternIndex][channel][step];
      if (currentVal.length < 2) { currentVal = (currentVal + "0").slice(0,2); }
      let newValArr = currentVal.split('');
      if (e.key === "^") { newValArr = ["^","^"]; }
      else { newValArr[digitIndex] = e.key; }
      track.patterns[currentPatternIndex][channel][step] = newValArr.join('');
      
      e.preventDefault();
      writePattern();
      // Reset caret to the beginning of this cell's editable region.
      patternEditEl.selectionStart = patternEditEl.selectionEnd = cellStart;
    });
    
    /***************************************************
     * Loop Range Controls
     ***************************************************/
    function validateLoopRange() {
      const total = getTotalPatterns();
      let ls = parseInt(document.getElementById("loopStart").value, 10);
      let le = parseInt(document.getElementById("loopEnd").value, 10);
      if (isNaN(ls) || ls < 1) ls = 1;
      if (isNaN(le) || le < 1) le = 1;
      if (ls > total) ls = total;
      if (le > total) le = total;
      if (ls > le) ls = le;
      document.getElementById("loopStart").value = ls;
      document.getElementById("loopEnd").value = le;
      loopStart = ls - 1;
      loopEnd = le - 1;
    }
    function updateLoopRangeDefaults() {
      const total = getTotalPatterns();
      document.getElementById("loopStart").value = 1;
      document.getElementById("loopEnd").value = total;
      loopStart = 0;
      loopEnd = total - 1;
    }
    
    /***************************************************
     * Pattern and Track Navigation
     ***************************************************/
    function previousPattern() {
      writePattern();
      if (currentPatternIndex > 0) { currentPatternIndex--; readPattern(); }
      else { alert("Already at the first pattern."); }
    }
    function nextPattern() {
      writePattern();
      if (currentPatternIndex < tracksData[0].patterns.length - 1) { currentPatternIndex++; readPattern(); }
      else { alert("Already at the last pattern."); }
    }
    function copyPattern() {
      writePattern();
      tracksData.forEach(track => {
        const currentPat = track.patterns[currentPatternIndex];
        const copiedPat = deepCopyPattern(currentPat);
        track.patterns.splice(currentPatternIndex, 0, copiedPat);
      });
      readPattern();
    }
    
    /***************************************************
     * Copy and Paste Functions
     ***************************************************/
    function copyToBuffer() {
      writePattern();
      patternBuffer = [];
      tracksData.forEach(track => { patternBuffer.push(deepCopyPattern(track.patterns[currentPatternIndex])); });
      alert("Pattern copied to buffer.");
    }
    function pasteFromBuffer() {
      if (!patternBuffer) { alert("Buffer is empty."); return; }
      writePattern();
      tracksData.forEach((track, tIndex) => { track.patterns[currentPatternIndex] = deepCopyPattern(patternBuffer[tIndex]); });
      readPattern();
    }
    
    /***************************************************
     * Data Persistence Functions
     ***************************************************/
    function savePatternData() {
      writePattern();
      const numTracks = tracksData.length;
      const numPatterns = tracksData.length > 0 ? tracksData[0].patterns.length : 0;
      const charsPerPattern = 2560;
      let header = String(numTracks).padStart(3, '0') +
                   String(numPatterns).padStart(3, '0') +
                   String(currentBPM).padStart(3, '0');
      let trackStream = "";
      tracksData.forEach(track => {
        track.patterns.forEach(pattern => {
          channels.forEach(key => { pattern[key].forEach(val => { trackStream += val; }); });
        });
      });
      const orchestraData = orchestraEl.value;
      const orchestraLength = orchestraData.length;
      header += String(orchestraLength).padStart(5, '0');
      const fullStream = header + trackStream + orchestraData;
      const buffer = new Uint8Array(fullStream.length);
      for (let i = 0; i < fullStream.length; i++) { buffer[i] = fullStream.charCodeAt(i); }
      const blob = new Blob([buffer], { type: "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "patternData.bin";
      a.click();
      URL.revokeObjectURL(url);
    }
    function loadPatternData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const buffer = new Uint8Array(e.target.result);
          let fullStream = "";
          for (let i = 0; i < buffer.length; i++) { fullStream += String.fromCharCode(buffer[i]); }
          const numTracks = parseInt(fullStream.substring(0, 3), 10);
          if (numTracks !== 8) { alert("Incompatible file: expected 8 tracks."); return; }
          const numPatterns = parseInt(fullStream.substring(3, 6), 10);
          const loadedBPM = parseInt(fullStream.substring(6, 9), 10);
          currentBPM = loadedBPM;
          bpmBuffer = currentBPM;
          document.getElementById("bpmSlider").value = currentBPM;
          const orchestraLength = parseInt(fullStream.substring(9, 14), 10);
          const trackDataLength = numTracks * numPatterns * 2560;
          const trackStream = fullStream.substring(14, 14 + trackDataLength);
          const orchestraData = fullStream.substring(14 + trackDataLength, 14 + trackDataLength + orchestraLength);
          let index = 0;
          tracksData = [];
          for (let t = 0; t < numTracks; t++) {
            let track = { header: `######${(t+1).toString().padStart(2, '0')}######`, patterns: [] };
            for (let p = 0; p < numPatterns; p++) {
              let pattern = { A: [], B: [], C: [], D: [], E: [] };
              channels.forEach(key => {
                for (let s = 0; s < stepsPerPattern; s++) {
                  pattern[key].push(trackStream.substring(index, index + 2));
                  index += 2;
                }
              });
              track.patterns.push(pattern);
            }
            tracksData.push(track);
          }
          currentPatternIndex = 0;
          readPattern();
          updateLoopRangeDefaults();
          orchestraEl.value = orchestraData;
          compile();
        } catch (err) { console.error("Error loading pattern data:", err); }
      };
      reader.readAsArrayBuffer(file);
    }
    
    /***************************************************
     * Example Song Loader Function
     ***************************************************/
    function loadExampleSong(filename) {
      fetch(filename)
        .then(response => { if (!response.ok) { throw new Error("File not found"); } return response.arrayBuffer(); })
        .then(buffer => {
          const uint8 = new Uint8Array(buffer);
          let fullStream = "";
          for (let i = 0; i < uint8.length; i++) { fullStream += String.fromCharCode(uint8[i]); }
          const numTracks = parseInt(fullStream.substring(0, 3), 10);
          if (numTracks !== 8) { alert("Incompatible file: expected 8 tracks."); return; }
          const numPatterns = parseInt(fullStream.substring(3, 6), 10);
          const loadedBPM = parseInt(fullStream.substring(6, 9), 10);
          currentBPM = loadedBPM;
          bpmBuffer = currentBPM;
          document.getElementById("bpmSlider").value = currentBPM;
          const orchestraLength = parseInt(fullStream.substring(9, 14), 10);
          const trackDataLength = numTracks * numPatterns * 2560;
          const trackStream = fullStream.substring(14, 14 + trackDataLength);
          const orchestraData = fullStream.substring(14 + trackDataLength, 14 + trackDataLength + orchestraLength);
          let index = 0;
          tracksData = [];
          for (let t = 0; t < numTracks; t++) {
            let track = { header: `######${(t+1).toString().padStart(2, '0')}######`, patterns: [] };
            for (let p = 0; p < numPatterns; p++) {
              let pattern = { A: [], B: [], C: [], D: [], E: [] };
              channels.forEach(key => {
                for (let s = 0; s < stepsPerPattern; s++) {
                  pattern[key].push(trackStream.substring(index, index + 2));
                  index += 2;
                }
              });
              track.patterns.push(pattern);
            }
            tracksData.push(track);
          }
          currentPatternIndex = 0;
          readPattern();
          updateLoopRangeDefaults();
          orchestraEl.value = orchestraData;
          compile();
        })
        .catch(err => { alert("There are no songs here, sorry."); console.error("Error loading example song:", err); });
    }
    
    /***************************************************
     * Song Initialization Function
     ***************************************************/
    function songInit() {
      if (confirm("This will delete all pattern and Csound data and reinitialize the song. Proceed?")) {
        tracksData = [];
        currentPatternIndex = 0;
        currentStepJS = 0;
        if (clockWorker) { clockWorker.postMessage({ type: "stop" }); }
        for (let i = 1; i <= 8; i++) { tracksData.push(generateTrack(i)); }
        updateLoopRangeDefaults();
        orchestraEl.value = updateCsoundOrc();
        readPattern();
        compile();
      }
    }
  </script>
</body>
